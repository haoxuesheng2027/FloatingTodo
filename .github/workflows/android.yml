name: Build FloatingTodo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug -x lint

    - name: Sign with release keystore
      run: |
        echo '' | base64 -d > app/release.keystore
        $JAVA_HOME/bin/jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore app/release.keystore -storepass '123456' -keypass '123456' \
          app/build/outputs/apk/debug/app-debug.apk floattodo

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FloatingTodo-APK
        path: app/build/outputs/apk/debug/app-debug.apk
